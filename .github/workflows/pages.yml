name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # La ruta base la calcula el propio script: un sitio de usuario vive en
      # la raiz del dominio y uno de proyecto bajo /<repositorio>.
      - name: Build estatico
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

      - id: despliegue
        uses: actions/deploy-pages@v4
